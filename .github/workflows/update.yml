name: Refresh Our Notes protobufs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install Go protobuf generators
        shell: pwsh
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Dump latest client
        run: python updater.py

      - name: Commit updated schemas
        id: git_commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add global/ proto/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No protobuf changes detected."
          else
            git commit -m 'refresh Our Notes protobuf dump'
            git push
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      # --- DISCORD NOTIFICATION STEPS ---

      - name: Discord Notification - Success (New Changes Pushed)
        if: success() && steps.git_commit.outputs.changes == 'true'
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if (-not $env:DISCORD_WEBHOOK) {
            Write-Host 'DISCORD_WEBHOOK secret is not configured; skipping notification.'
            exit 0
          }
          $payload = @{
            embeds = @(@{
              title = '✅ Protobuf Successfully Refreshed!'
              description = "New protobuf schemas were dumped, committed, and pushed.`n[View workflow run]($env:RUN_URL)"
              color = 65280
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload

      - name: Discord Notification - Workflow Failed
        if: failure()
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if (-not $env:DISCORD_WEBHOOK) {
            Write-Host 'DISCORD_WEBHOOK secret is not configured; skipping notification.'
            exit 0
          }
          $payload = @{
            embeds = @(@{
              title = '❌ Workflow Failed: Refresh Protobufs'
              description = "An error occurred while updating the protobufs.`n[View workflow run]($env:RUN_URL)"
              color = 16711680
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
