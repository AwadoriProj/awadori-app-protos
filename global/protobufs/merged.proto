message app {
	message activity {
		message ActivityConfig {
			int64 activity_id = 1;
			string name = 2;
			int32 type = 3;
			int64 start_at = 4;
			int64 end_at = 5;
			int32 display = 6;
			int32 icon_seq_id = 7;
		}

		message GetAllActivitiesRequest {
		}

		message GetAllActivitiesResponse {
			repeated ActivityConfig activities = 1;
		}

		service ActivityService {
			rpc GetAllActivities (.app.activity.GetAllActivitiesRequest) returns (.app.activity.GetAllActivitiesResponse);
		}
	}

	message announcement {
		enum Tab {
			ALL = 0;
			OPENING_EVENTS = 1;
			BUG = 2;
		}

		message GetListRequest {
			Tab selected_tab = 1;
		}

		message GetListResponse {
			repeated .entity.Announcement announcements = 1;
			repeated .entity.AnnouncementExternalContent external_contents = 2;
		}

		message GetRequest {
			int64 id = 1;
		}

		message GetResponse {
			.entity.Announcement announcement = 1;
		}

		service AnnouncementService {
			rpc GetList (.app.announcement.GetListRequest) returns (.app.announcement.GetListResponse) {
				option (entity.method_options.skip_authentication) = true;
			}

			rpc Get (.app.announcement.GetRequest) returns (.app.announcement.GetResponse) {
				option (entity.method_options.skip_authentication) = true;
			}
		}
	}

	message arena {
		message ReportPenaltyRequest {
			int32 penalty = 1;
		}

		message ReportPenaltyResponse {
		}

		message ArenaTopRequest {
			int64 arena_season_id = 1;
		}

		message ArenaTopResponse {
			.entity.ArenaTopLastStatus latest_status = 1;
			int64 mp = 2;
			repeated .entity.ArenaLp lp = 3;
			repeated .entity.ArenaTopDailyRewards daily_rewards = 4;
			int32 penalty_count = 5;
			int64 before_season_id = 6;
			bool is_show_season_result = 7;
			repeated int64 arena_promotion_reward_ids = 8;
			repeated .entity.ArenaLpRankDiff lp_rank_diff = 9;
			repeated .entity.ArenaDedicatedDecks arena_dedicated_decks = 10;
		}

		message ConsecutiveWinsRequest {
			int64 arena_season_id = 1;
		}

		message ConsecutiveWinsResponse {
			repeated .entity.ArenaConsecutiveWins arena_consecutive_wins = 1;
		}

		message DeckTrendRequest {
			int64 music_id = 1;
			int64 arena_season_id = 2;
		}

		message DeckTrendResponse {
			repeated .entity.ArenaDeckTrendMemberCard leaders = 1;
			repeated .entity.ArenaDeckTrendMemberCard members = 2;
			repeated .entity.ArenaDeckTrendSupportCard supports = 3;
		}

		message ArenaRewardsRequest {
			int64 arena_season_id = 1;
		}

		message ArenaRewardsResponse {
			.entity.ArenaSeason season = 1;
			.entity.ArenaMasterRanking master_ranking = 2;
			repeated .entity.ArenaBandRankings band_rankings = 3;
			repeated .entity.ArenaMasterPromotionRewards master_promotion_rewards = 4;
			repeated .entity.ArenaBandPromotionRewards band_promotion_rewards = 5;
		}

		message ArenaRankingRequest {
			int64 arena_season_id = 1;
			optional int64 band_id = 2;
			int64 ranking_start = 3;
			int64 ranking_end = 4;
		}

		message ArenaRankingResponse {
			repeated .entity.ArenaRankingEntry ranking = 1;
			int64 max_rank = 2;
		}

		message ArenaMyRankRequest {
			int64 arena_season_id = 1;
		}

		message ArenaMyRankResponse {
			.entity.ArenaMyRankMasterPoint mp = 1;
			repeated .entity.ArenaMyRankLeaguePoint lp = 2;
		}

		message MatchingHistoriesRequest {
		}

		message MatchingHistoriesResponse {
			repeated .entity.ArenaMatchingHistories matching_histories = 1;
		}

		message SaveDedicatedDecksRequest {
			.entity.ArenaDedicatedDecks deck = 1;
		}

		message SaveDedicatedDecksResponse {
		}

		service ArenaService {
			rpc ReportPenalty (.app.arena.ReportPenaltyRequest) returns (.app.arena.ReportPenaltyResponse);
			rpc ArenaTop (.app.arena.ArenaTopRequest) returns (.app.arena.ArenaTopResponse);
			rpc ConsecutiveWins (.app.arena.ConsecutiveWinsRequest) returns (.app.arena.ConsecutiveWinsResponse);
			rpc DeckTrend (.app.arena.DeckTrendRequest) returns (.app.arena.DeckTrendResponse);
			rpc ArenaRewards (.app.arena.ArenaRewardsRequest) returns (.app.arena.ArenaRewardsResponse);
			rpc ArenaRanking (.app.arena.ArenaRankingRequest) returns (.app.arena.ArenaRankingResponse);
			rpc ArenaMyRank (.app.arena.ArenaMyRankRequest) returns (.app.arena.ArenaMyRankResponse);
			rpc MatchingHistories (.app.arena.MatchingHistoriesRequest) returns (.app.arena.MatchingHistoriesResponse);
			rpc SaveDedicatedDecks (.app.arena.SaveDedicatedDecksRequest) returns (.app.arena.SaveDedicatedDecksResponse);
		}
	}

	message banditem {
		message LevelUpRequest {
			int64 band_item_master_id = 1;
			int32 to_level = 2;
		}

		message LevelUpResponse {
			.entity.Notification notification = 1;
		}

		service BandItemService {
			rpc LevelUp (.app.banditem.LevelUpRequest) returns (.app.banditem.LevelUpResponse);
		}
	}

	message callback {
		message PaySdkCallbackRequest {
			string data = 1;
		}

		message PaySdkSchedulingForwardingRequest {
			string data = 1;
		}

		message PaySdkSchedulingForwardingResponse {
			bool IsSuccess = 1;
		}

		service CallbackService {
			rpc PaySdkCallback (.app.callback.PaySdkCallbackRequest) returns (.google.protobuf.Empty);
			rpc PaySdkSchedulingForwarding (.app.callback.PaySdkSchedulingForwardingRequest) returns (.app.callback.PaySdkSchedulingForwardingResponse);
		}
	}

	message carousel_help {
		message ShownRequest {
			repeated int64 master_ids = 1;
		}

		message ShownResponse {
		}

		service CarouselHelpService {
			rpc Shown (.app.carousel_help.ShownRequest) returns (.app.carousel_help.ShownResponse);
		}
	}

	message character {
		message GainFriendshipRankRewardRequest {
			repeated .entity.CharacterFriendshipRankReward rewards = 1;
		}

		message GainFriendshipRankRewardResponse {
			.entity.Notification notification = 1;
		}

		service CharacterService {
			rpc GainFriendshipRankReward (.app.character.GainFriendshipRankRewardRequest) returns (.app.character.GainFriendshipRankRewardResponse);
		}
	}

	message chat {
		message ClientSendIMMsgRequest {
			IMMsg Msg = 1;
		}

		message ClientSendIMMsgResponse {
			int32 Ret = 1;
			string Content = 2;
		}

		message ClientSyncMsgRequest {
			int32 Type = 1;
			int64 LastMsgID = 2;
			int64 Receiver = 3;
		}

		message ClientSyncMsgResponse {
			int32 Ret = 1;
		}

		message ClientGetWorldRoomListRequest {
		}

		message ClientGetWorldRoomListResponse {
			int32 Ret = 1;
			repeated WorldRoomInfo RoomInfos = 2;
		}

		message ClientSwitchWorldRoomRequest {
			int64 TargetRoomID = 1;
		}

		message ClientSwitchWorldRoomResponse {
			int32 Ret = 1;
			int64 WorldRoomID = 2;
		}

		message TopicSetting {
			int64 topic_id = 1;
			bool visible = 2;
		}

		message ChatDisplaySettings {
			bool world_channel_visible = 1;
			bool world_filter_text = 2;
			bool world_filter_stamp = 3;
			bool world_filter_entertain = 4;
			repeated TopicSetting topics = 5;
		}

		message ClientSetChatSettingsRequest {
			repeated int64 special_focus_account_ids = 1;
			int64 chat_theme_id = 2;
			int64 chat_bubble_id = 3;
			int64 chat_frame_id = 4;
			ChatDisplaySettings display_settings = 5;
		}

		message ClientSetChatSettingsResponse {
			int32 Ret = 1;
		}

		message ClientGetChatSettingsRequest {
		}

		message ClientGetChatSettingsResponse {
			int32 Ret = 1;
			repeated int64 special_focus_account_ids = 2;
			int64 chat_theme_id = 3;
			int64 chat_bubble_id = 4;
			int64 chat_frame_id = 5;
			ChatDisplaySettings display_settings = 6;
		}

		message GetNotificationsRequest {
		}

		message GetNotificationsResponse {
			repeated NotificationInfo notifications = 1;
		}

		message ClaimNotificationRequest {
			int64 notification_id = 1;
		}

		message ClaimNotificationResponse {
			int32 Ret = 1;
			string message = 2;
		}

		message ChatReportRequest {
			int64 target_player_id = 1;
			string message = 2;
			optional string reason = 3;
		}

		message ChatReportResponse {
			int32 ret = 1;
			int32 chat_report_used_today = 2;
		}

		service ClientChatService {
			rpc SendIMMsg (.app.chat.ClientSendIMMsgRequest) returns (.app.chat.ClientSendIMMsgResponse) {
				option (entity.method_options.maintenance_features).chat = true;
			}

			rpc SyncMsg (.app.chat.ClientSyncMsgRequest) returns (.app.chat.ClientSyncMsgResponse) {
				option (entity.method_options.maintenance_features).chat = true;
			}

			rpc GetWorldRoomList (.app.chat.ClientGetWorldRoomListRequest) returns (.app.chat.ClientGetWorldRoomListResponse) {
				option (entity.method_options.maintenance_features).chat = true;
			}

			rpc SwitchWorldRoom (.app.chat.ClientSwitchWorldRoomRequest) returns (.app.chat.ClientSwitchWorldRoomResponse) {
				option (entity.method_options.maintenance_features).chat = true;
			}

			rpc SetChatSettings (.app.chat.ClientSetChatSettingsRequest) returns (.app.chat.ClientSetChatSettingsResponse);
			rpc GetChatSettings (.app.chat.ClientGetChatSettingsRequest) returns (.app.chat.ClientGetChatSettingsResponse);
			rpc GetNotifications (.app.chat.GetNotificationsRequest) returns (.app.chat.GetNotificationsResponse);
			rpc ClaimNotification (.app.chat.ClaimNotificationRequest) returns (.app.chat.ClaimNotificationResponse);
			rpc Report (.app.chat.ChatReportRequest) returns (.app.chat.ChatReportResponse);
		}

		enum gmChatOpt {
			ChatOpt_None = 0;
			ChatOpt_GetForbid = 1;
			ChatOpt_SetForbid = 2;
		}

		enum MessageType {
			MessageType_Chat_Emoji = 0;
			MessageType_Chat_Text = 1;
			MessageType_Chat_TextFromSound = 2;
			MessageType_Chat_InviteTeam = 3;
			MessageType_Chat_InviteLeague = 4;
			MessageType_Chat_RoomDismiss = 5;
			MessageType_System_FriendAdded = 6;
		}

		enum EIMType {
			IM_Peer = 0;
			IM_Room = 4;
		}

		message GRPCCommonResponse {
			int32 code = 1;
			string message = 2;
		}

		message GRPCPing {
			int32 timestamp = 1;
		}

		message BaseNoti {
			int32 RetCode = 1;
			string RetMsg = 2;
		}

		message RPCCommonNoti {
			int32 Ret = 1;
		}

		message MessageRetNoti {
			BaseNoti Base = 3;
		}

		message CSCommonMessage {
			string Msgkey = 2;
			bytes Msgbody = 3;
		}

		message ChatText {
			int32 ID = 1;
			string Text = 2;
		}

		message ChatEmoji {
			int32 ID = 1;
			int32 EmojiID = 2;
		}

		message ChatTextFromSound {
			int32 ID = 1;
			string Text = 2;
			string SoundUrl = 3;
		}

		message ChatJoinLeagueAccepted {
			int32 ID = 1;
		}

		message IMMsg {
			int64 MsgID = 2;
			int64 Sender = 3;
			int64 Receiver = 4;
			repeated int64 Receivers = 9;
			int32 Type = 5;
			int32 MsgType = 6;
			string Content = 7;
			int64 Time = 8;
		}

		message IMMsgs {
			repeated IMMsg Msgs = 1;
		}

		message MessageIMNoti {
			repeated IMMsg Msgs = 3;
		}

		message MessageNewMsgNoti {
			int64 MsgID = 2;
			int64 Receiver = 3;
		}

		message MessageGroupMsgNoti {
			IMMsg Msg = 1;
			repeated int64 AccountIDs = 5;
		}

		message WorldRoomInfo {
			int64 RoomID = 1;
			int32 MemberNum = 2;
			int32 MaxMemberNum = 3;
		}

		message NotificationReward {
			int32 resource_type = 1;
			int64 resource_id = 2;
			int32 resource_count = 3;
		}

		message NotificationInfo {
			int64 id = 1;
			int32 notification_type = 2;
			string title = 3;
			string content = 4;
			int64 expire_at = 5;
			bool has_rewards = 6;
			bool claimed = 7;
			repeated NotificationReward rewards = 8;
			int64 created_at = 9;
		}

		message RPCGMChatOptReq {
			int64 AccountID = 1;
			gmChatOpt Opt = 2;
			int64 EndTime = 3;
		}

		message RPCGMChatOptNoti {
			int32 Ret = 1;
			int64 EndTime = 2;
		}

		message RPCInitWorldRoomReq {
			int32 ZoneID = 1;
			int64 AccountID = 2;
		}

		message RPCEnterWorldRoomReq {
			int32 ZoneID = 1;
			int64 AccountID = 2;
			int32 GatesvrID = 3;
		}

		message RPCEnterWorldRoomNoti {
			int32 Ret = 1;
			int64 WorldRoomID = 2;
		}

		message RPCGetWorldRoomListReq {
			int32 ZoneID = 1;
			int64 AccountID = 2;
		}

		message RPCGetWorldRoomListNoti {
			int32 Ret = 1;
			repeated WorldRoomInfo RoomInfos = 2;
		}

		message RPCSwitchWorldRoomReq {
			int32 ZoneID = 1;
			int64 AccountID = 2;
			int64 TargetRoomID = 3;
		}

		message RPCSwitchWorldRoomNoti {
			int32 Ret = 1;
			int64 WorldRoomID = 2;
		}

		message RPCEnterIMReq {
			int64 AccountID = 1;
			repeated int64 RoomIDs = 2;
			int32 GatesvrID = 3;
		}

		message RPCMigrateIMReq {
			int64 AccountID = 1;
			repeated int64 RoomIDs = 2;
			int32 GatesvrID = 3;
		}

		message RPCLeaveIMReq {
			int64 AccountID = 1;
			bool IsSpec = 2;
		}

		message RPCEnterIMRoomReq {
			int64 AccountID = 1;
			int64 RoomID = 2;
		}

		message RPCLeaveIMRoomReq {
			int64 AccountID = 1;
			int64 RoomID = 2;
		}

		message RPCGenIMRoomIDReq {
			int64 AccountID = 1;
			int32 ChatRoomType = 2;
		}

		message RPCGenIMRoomIDNoti {
			int32 Ret = 1;
			int64 RoomID = 2;
		}

		message RPCSendIMMsgReq {
			IMMsg Msg = 1;
		}

		message RPCSyncMsgReq {
			int32 Type = 1;
			int64 AccountID = 2;
			int64 LastMsgID = 3;
			int64 Receiver = 4;
		}

		message RPCSyncMsgNoti {
			int32 Ret = 1;
		}

		message RPCCloseConnReq {
			int64 AccountID = 1;
			int32 GatesvrID = 2;
		}

		service IMService {
			rpc Ping (.app.chat.GRPCPing) returns (.app.chat.GRPCPing);
			rpc ServiceGMChatOpt (.app.chat.RPCGMChatOptReq) returns (.app.chat.RPCGMChatOptNoti);
			rpc ServiceInitWorldRoom (.app.chat.RPCInitWorldRoomReq) returns (.app.chat.RPCCommonNoti);
			rpc ServiceEnterWorldRoom (.app.chat.RPCEnterWorldRoomReq) returns (.app.chat.RPCEnterWorldRoomNoti);
			rpc ServiceGetWorldRoomList (.app.chat.RPCGetWorldRoomListReq) returns (.app.chat.RPCGetWorldRoomListNoti);
			rpc ServiceSwitchWorldRoom (.app.chat.RPCSwitchWorldRoomReq) returns (.app.chat.RPCSwitchWorldRoomNoti);
			rpc ServiceLeaveIM (.app.chat.RPCLeaveIMReq) returns (.app.chat.RPCCommonNoti);
			rpc ServiceEnterIM (.app.chat.RPCEnterIMReq) returns (.app.chat.RPCCommonNoti);
			rpc ServiceEnterIMRoom (.app.chat.RPCEnterIMRoomReq) returns (.app.chat.RPCCommonNoti);
			rpc ServiceLeaveIMRoom (.app.chat.RPCLeaveIMRoomReq) returns (.app.chat.RPCCommonNoti);
			rpc ServiceGenIMRoomID (.app.chat.RPCGenIMRoomIDReq) returns (.app.chat.RPCGenIMRoomIDNoti);
			rpc ServiceSendIMMsg (.app.chat.RPCSendIMMsgReq) returns (.app.chat.RPCCommonNoti);
			rpc ServiceSyncMsg (.app.chat.RPCSyncMsgReq) returns (.app.chat.RPCSyncMsgNoti);
			rpc ServiceCloseConn (.app.chat.RPCCloseConnReq) returns (.app.chat.RPCCommonNoti);
		}

		message MessageLoginIMReq {
			int64 AccountID = 2;
			string UserToken = 3;
			string ClientIP = 4;
		}

		message MessageLoginIMResp {
			int64 ID = 1;
			int32 Ret = 2;
			int64 AccountID = 3;
			int64 WorldChatRoomID = 4;
		}

		message MessageCloseConn {
			int64 AccountID = 2;
			string UserToken = 3;
		}
	}

	message circle {
		message SaveCircleRequest {
			.entity.SaveCircleParams params = 1;
		}

		message CreateCircleResponse {
			uint64 circle_id = 1;
			optional uint64 circle_chat_room_id = 2;
			.entity.Notification notification = 3;
		}

		message GetCircleSettingRequest {
		}

		message GetCircleSettingResponse {
			.entity.Circle circle = 1;
			.entity.CirclePlayer circle_player = 2;
			int32 circle_mission_reward_count = 3;
			.entity.Notification notification = 4;
		}

		message EditCircleResponse {
		}

		message SearchRequest {
			.entity.SearchOptions options = 1;
		}

		message SearchResponse {
			repeated .entity.CircleWithMasterPlayer circles = 1;
		}

		message GetRecommendedCircleListRequest {
		}

		message GetRecommendedCircleListResponse {
			repeated .entity.CircleWithMasterPlayer circles = 1;
		}

		message GetCircleRequest {
			uint64 circle_id = 1;
		}

		message GetCircleResponse {
			.entity.CircleDetailWithPlayerList circle = 1;
		}

		message ChangeAuthRequest {
			string player_id = 1;
		}

		message ChangeAuthResponse {
		}

		message RemovePlayerRequest {
			string player_id = 1;
		}

		message RemovePlayerResponse {
		}

		message ExitCircleRequest {
		}

		message ExitCircleResponse {
		}

		message UpdateCircleTopResponse {
			.entity.UpdateCircleTop circle_top = 1;
		}

		service CircleService {
			rpc CreateCircle (.app.circle.SaveCircleRequest) returns (.app.circle.CreateCircleResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc GetCircle (.app.circle.GetCircleSettingRequest) returns (.app.circle.GetCircleSettingResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc EditCircle (.app.circle.SaveCircleRequest) returns (.app.circle.EditCircleResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc Search (.app.circle.SearchRequest) returns (.app.circle.SearchResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc GetRecommendedCircleList (.app.circle.GetRecommendedCircleListRequest) returns (.app.circle.GetRecommendedCircleListResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc GetCircleDetail (.app.circle.GetCircleRequest) returns (.app.circle.GetCircleResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc TransferMaster (.app.circle.ChangeAuthRequest) returns (.app.circle.ChangeAuthResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc TransferSubmaster (.app.circle.ChangeAuthRequest) returns (.app.circle.ChangeAuthResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc SetSubmaster (.app.circle.ChangeAuthRequest) returns (.app.circle.ChangeAuthResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc UnsetSubmaster (.app.circle.ChangeAuthRequest) returns (.app.circle.ChangeAuthResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc RemovePlayer (.app.circle.RemovePlayerRequest) returns (.app.circle.RemovePlayerResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc ExitCircle (.app.circle.ExitCircleRequest) returns (.app.circle.ExitCircleResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc DeleteCircle (.google.protobuf.Empty) returns (.google.protobuf.Empty) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc UpdateCircleTop (.google.protobuf.Empty) returns (.app.circle.UpdateCircleTopResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}
		}
	}

	message circleinvitation {
		message InviteCircleRequest {
			optional string player_id = 1;
		}

		message RevokeCircleInvitationRequest {
			optional string player_id = 1;
		}

		message GetInvitationListRequest {
		}

		message GetInvitationListResponse {
			repeated .entity.CircleInvitation invitations = 1;
		}

		message GetCircleInvitationRecommendListResponse {
			repeated .entity.PlayerSimpleProfile player_basic_profiles = 1;
		}

		message GetInvitablePlayerRequest {
			optional string player_id = 1;
		}

		message GetInvitablePlayerResponse {
			.entity.PlayerSimpleProfile player_basic_profile = 1;
		}

		message GetInvitingPlayerResponse {
			repeated .entity.PlayerSimpleProfile player_basic_profiles = 1;
		}

		service CircleInvitationService {
			rpc InviteCircle (.app.circleinvitation.InviteCircleRequest) returns (.google.protobuf.Empty) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc RevokeCircleInvitation (.app.circleinvitation.RevokeCircleInvitationRequest) returns (.google.protobuf.Empty) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc GetInvitationList (.app.circleinvitation.GetInvitationListRequest) returns (.app.circleinvitation.GetInvitationListResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc GetCircleInvitationRecommendList (.google.protobuf.Empty) returns (.app.circleinvitation.GetCircleInvitationRecommendListResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc GetInvitablePlayer (.app.circleinvitation.GetInvitablePlayerRequest) returns (.app.circleinvitation.GetInvitablePlayerResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc GetInvitingPlayer (.google.protobuf.Empty) returns (.app.circleinvitation.GetInvitingPlayerResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}
		}
	}

	message circlejoinrequest {
		message CircleJoinReqRequest {
			optional uint64 circle_id = 1;
		}

		message CircleJoinReqResponse {
			optional uint64 circle_id = 1;
		}

		message CircleJoinApproveRequest {
			optional string player_id = 1;
		}

		message CircleJoinApproveResponse {
		}

		message CircleJoinRevokeRequest {
			optional string player_id = 1;
		}

		message CircleJoinRevokeResponse {
		}

		message GetCircleJoinRequestListResponse {
			repeated .entity.CircleJoinRequest circle_join_requests = 1;
		}

		service CircleJoinReqService {
			rpc CircleJoinReq (.app.circlejoinrequest.CircleJoinReqRequest) returns (.app.circlejoinrequest.CircleJoinReqResponse) {
				option (entity.method_options.maintenance_features).circle = true;
			}

			rpc CircleJoinApprove (.app.circlejoinrequest.CircleJoinApproveRequest) returns (.app.circlejoinrequest.CircleJoinApproveResponse) {
				option (entity.method_options.maintenance_features).circle = true;
