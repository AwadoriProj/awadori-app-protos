			repeated Option options = 3;
			SourceContext source_context = 4;
			Syntax syntax = 5;
			string edition = 6;
		}

		message EnumValue {
			string name = 1;
			int32 number = 2;
			repeated Option options = 3;
		}

		message Option {
			string name = 1;
			Any value = 2;
		}
	}
}
