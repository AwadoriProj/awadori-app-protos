syntax = "proto3";

import "entity/player_profile.proto";

package entity;

option csharp_namespace = "App.Protobuf.Entity";

message InvitationProfile {
	PlayerSimpleProfile player_profile = 1;
	int64 establishment_at = 2;
}

message Invitation {
	repeated string new_invitation_player_ids = 1;
	bool is_invitation_code_input_already = 2;
}
