syntax = "proto3";

package entity;

option csharp_namespace = "App.Protobuf.Entity";

message CharacterCurrentCostume {
	int64 character_id = 1;
	int32 costume_target = 2;
	int64 costume_group_id = 3;
}

message CharacterUnlockedCostume {
	int64 character_id = 1;
	int64 costume_group_id = 2;
	int64 got_at = 3;
}
