		message RPCEnterIMRoomReq {
			optional int64 AccountID = 1;
			optional int64 RoomID = 2;
		}

		message RPCLeaveIMRoomReq {
			optional int64 AccountID = 1;
			optional int64 RoomID = 2;
		}

		message RPCGenIMRoomIDReq {
			optional int64 AccountID = 1;
			optional int32 ChatRoomType = 2;
		}

		message RPCGenIMRoomIDNoti {
			optional int32 Ret = 1;
			optional int64 RoomID = 2;
		}

		message RPCSendIMMsgReq {
			optional .app.chat.IMMsg Msg = 1;
		}

		message RPCSyncMsgReq {
			optional int32 Type = 1;
			optional int64 AccountID = 2;
			optional int64 LastMsgID = 3;
			optional int64 Receiver = 4;
		}

		message RPCSyncMsgNoti {
			optional int32 Ret = 1;
		}

		message RPCCloseConnReq {
			optional int64 AccountID = 1;
			optional int32 GatesvrID = 2;
		}

		message MessageLoginIMReq {
			optional int64 AccountID = 2;
			optional string UserToken = 3;
			optional string ClientIP = 4;
		}

		message MessageLoginIMResp {
			optional int64 ID = 1;
			optional int32 Ret = 2;
			optional int64 AccountID = 3;
			optional int64 WorldChatRoomID = 4;
		}

		message MessageCloseConn {
			optional int64 AccountID = 2;
			optional string UserToken = 3;
		}
