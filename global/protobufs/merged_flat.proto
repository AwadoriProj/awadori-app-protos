			optional int32 Ret = 1;
			repeated .app.chat.WorldRoomInfo RoomInfos = 2;
		}

		message ClientSwitchWorldRoomRequest {
			optional int64 TargetRoomID = 1;
		}

		message ClientSwitchWorldRoomResponse {
			optional int32 Ret = 1;
			optional int64 WorldRoomID = 2;
		}

		message TopicSetting {
			optional int64 topic_id = 1;
			optional bool visible = 2;
		}

		message ChatDisplaySettings {
			optional bool world_channel_visible = 1;
			optional bool world_filter_text = 2;
			optional bool world_filter_stamp = 3;
			optional bool world_filter_entertain = 4;
			repeated .app.chat.TopicSetting topics = 5;
		}

		message ClientSetChatSettingsRequest {
			repeated int64 special_focus_account_ids = 1;
			optional int64 chat_theme_id = 2;
			optional int64 chat_bubble_id = 3;
			optional int64 chat_frame_id = 4;
			optional .app.chat.ChatDisplaySettings display_settings = 5;
		}

		message ClientSetChatSettingsResponse {
			optional int32 Ret = 1;
		}

		message ClientGetChatSettingsRequest {
		}

		message ClientGetChatSettingsResponse {
			optional int32 Ret = 1;
			repeated int64 special_focus_account_ids = 2;
			optional int64 chat_theme_id = 3;
			optional int64 chat_bubble_id = 4;
			optional int64 chat_frame_id = 5;
			optional .app.chat.ChatDisplaySettings display_settings = 6;
		}

		message GetNotificationsRequest {
		}

		message GetNotificationsResponse {
			repeated .app.chat.NotificationInfo notifications = 1;
		}

		message ClaimNotificationRequest {
			optional int64 notification_id = 1;
		}

		message ClaimNotificationResponse {
			optional int32 Ret = 1;
			optional string message = 2;
		}

		message ChatReportRequest {
			optional int64 target_player_id = 1;
			optional string message = 2;
			optional string reason = 3;
		}

		message ChatReportResponse {
			optional int32 ret = 1;
			optional int32 chat_report_used_today = 2;
		}

		message GRPCCommonResponse {
			optional int32 code = 1;
			optional string message = 2;
		}

		message GRPCPing {
			optional int32 timestamp = 1;
		}

		message BaseNoti {
			optional int32 RetCode = 1;
			optional string RetMsg = 2;
		}

		message RPCCommonNoti {
			optional int32 Ret = 1;
		}

		message MessageRetNoti {
			optional .app.chat.BaseNoti Base = 3;
		}

		message CSCommonMessage {
			optional string Msgkey = 2;
			optional bytes Msgbody = 3;
		}

		message ChatText {
			optional int32 ID = 1;
			optional string Text = 2;
		}

		message ChatEmoji {
			optional int32 ID = 1;
			optional int32 EmojiID = 2;
		}

		message ChatTextFromSound {
			optional int32 ID = 1;
			optional string Text = 2;
			optional string SoundUrl = 3;
		}

		message ChatJoinLeagueAccepted {
			optional int32 ID = 1;
		}

		message IMMsg {
			optional int64 MsgID = 2;
			optional int64 Sender = 3;
			optional int64 Receiver = 4;
			repeated int64 Receivers = 9;
			optional int32 Type = 5;
			optional int32 MsgType = 6;
			optional string Content = 7;
			optional int64 Time = 8;
		}

		message IMMsgs {
			repeated .app.chat.IMMsg Msgs = 1;
		}

		message MessageIMNoti {
			repeated .app.chat.IMMsg Msgs = 3;
		}

		message MessageNewMsgNoti {
			optional int64 MsgID = 2;
			optional int64 Receiver = 3;
		}

		message MessageGroupMsgNoti {
