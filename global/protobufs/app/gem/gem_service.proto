syntax = "proto3";

import "entity/gem.proto";

package app.gem;

option csharp_namespace = "App.Protobuf.Gem";

message HistoryRequest {
}

message HistoryResponse {
	repeated .entity.GemHistory histories = 1;
}

service GemService {
	rpc History (.app.gem.HistoryRequest) returns (.app.gem.HistoryResponse);
}
