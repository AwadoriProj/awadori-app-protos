syntax = "proto3";

package app.spot;

option csharp_namespace = "App.Protobuf.Spot";

message UpdateSpotFavoritesRequest {
	repeated int64 spot_ids = 1;
}

message UpdateSpotFavoritesResponse {
}

service SpotService {
	rpc UpdateSpotFavorites (.app.spot.UpdateSpotFavoritesRequest) returns (.app.spot.UpdateSpotFavoritesResponse);
}
